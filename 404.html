<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>404 — Page Not Found | Ismeil Solution</title>
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #1c2533;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: #0047AB;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 22px;
            position: relative;
        }

        .logo-icon small {
            position: absolute;
            bottom: -10px;
            font-size: 7px;
            letter-spacing: 0.5px;
            color: #5e6f8d;
            background: #f8fafc;
            padding: 0 4px;
        }

        .logo-text {
            font-weight: 700;
            font-size: 1.5rem;
            color: #0047AB;
            line-height: 1.1;
        }

        .logo-text span {
            font-weight: 300;
            font-size: 0.6rem;
            color: #7b8aa3;
            letter-spacing: 2px;
            display: block;
            text-transform: uppercase;
        }

        .error-code {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 8rem;
            font-weight: 900;
            color: #0d1f3c;
            line-height: 1;
            margin-bottom: 8px;
        }

        .error-code span {
            color: #f5c518;
        }

        h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            color: #0d1f3c;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        p {
            color: #6b7280;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 28px;
            max-width: 440px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .btn-primary {
            background: #0047AB;
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary:hover {
            background: #003380;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: #1e2b3c;
            padding: 12px 28px;
            border-radius: 30px;
            border: 1.5px solid #d0d7e2;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
        }

        .btn-outline:hover {
            background: #f0f3f8;
            border-color: #b0bcca;
        }

        .illustration {
            font-size: 4rem;
            margin-bottom: 16px;
            display: block;
        }

        .footer {
            margin-top: 40px;
            font-size: 0.65rem;
            color: #a0b3cc;
            border-top: 1px solid #e9edf2;
            padding-top: 20px;
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 5rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .logo-text {
                font-size: 1.1rem;
            }
            .btn-primary, .btn-outline {
                padding: 10px 20px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <div class="logo-icon">iS<small>ISMEIL</small></div>
            <div class="logo-text">ISMEIL SOLUTION<span>LOGISTICS</span></div>
        </div>

        <!-- 404 Illustration -->
        <span class="illustration">🚚</span>

        <!-- Error Code -->
        <div class="error-code">4<span>0</span>4</div>

        <!-- Message -->
        <h1>Page Not Found</h1>
        <p>Oops! The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>

        <!-- Buttons -->
        <div class="btn-group">
            <a href="/" class="btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1"/></svg>
                Homepage
            </a>
            <a href="/contact.html" class="btn-outline">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                Contact Us
            </a>
        </div>

        <!-- Footer -->
        <div class="footer">
            &copy; 2026 ISMEIL SOLUTION — Logistics without limits.
        </div>
    </div>
</body>
</html>
